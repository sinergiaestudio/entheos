name: ANATHEOS AFE · synthetic geometry
on:
  push:
    branches: ['experiment/anatheos-afe-engine']
    paths:
      - 'research/anatheos-afe/**'
      - '.github/workflows/anatheos-afe-synthetic.yml'
  pull_request:
    paths:
      - 'research/anatheos-afe/**'
      - '.github/workflows/anatheos-afe-synthetic.yml'
  workflow_dispatch:
jobs:
  synthetic-geometry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test synthetic physical geometry (no PHI)
        working-directory: research/anatheos-afe
        run: |
          python -m compileall -q afe tests
          python -m unittest discover -s tests -v
      - name: Cross-check Python physical affine against existing ANATHEOS JS and analytic reference
        working-directory: research/anatheos-afe
        run: |
          PYTHONPATH=. python tests/make_crosscheck_fixtures.py /tmp/afe-crosscheck.json
          node tests/crosscheck_existing.mjs /tmp/afe-crosscheck.json
      - name: Create source-only recovery archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --exclude='*/__pycache__' --exclude='*.pyc' -czf dist/afe-source.tar.gz research/anatheos-afe .github/workflows/anatheos-afe-synthetic.yml
          if tar -tzf dist/afe-source.tar.gz | grep -E '(__pycache__/|\.pyc$)'; then echo 'Compiled cache leaked into source backup' >&2; exit 1; fi
          ( cd dist && sha256sum afe-source.tar.gz > SHA256SUMS.txt )
          printf '%s\n' "$GITHUB_SHA" > dist/COMMIT_SHA.txt
      - name: Publish ephemeral source-only backup for private Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: afe-source-${{ github.sha }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error
