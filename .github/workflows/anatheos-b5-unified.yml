name: ANATHEOS B5.1 · unified study workflow (local only)
on:
  push:
    branches:
      - anatheos/issue-8p-v06-unified-local-workflow
  pull_request:
    paths:
      - "demos/anatheos-local-v0.5/**"
      - ".github/workflows/anatheos-b5-unified.yml"
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node syntax and existing segmentation/mesh unit tests
        working-directory: demos/anatheos-local-v0.5
        run: |
          set -euo pipefail
          node --check workflow-b5.mjs
          node --check browser_b5_workflow.mjs
          node --check app.js
          node --check surface-ui.mjs
          node --test test_segmentation.mjs test_volume_core.mjs test_surfaces.mjs test_spl_provenance.mjs
      - name: Browser smoke incl. automatic startup and contextual controls
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install --only-shell chromium
          (cd demos/anatheos-local-v0.5 && python3 -m http.server 8774 --bind 127.0.0.1) >/tmp/anatheos-b5.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do if curl --silent --output /dev/null http://127.0.0.1:8774/;then break;fi;sleep 1;done
          node demos/anatheos-local-v0.5/browser_b5_workflow.mjs
      - name: Package B5 source with all required modules and no study files
        run: |
          set -euo pipefail
          root=demos/anatheos-local-v0.5
          stage=ANATHEOS_3D_v0.6_B5_CODIGO
          mkdir -p "build/$stage"
          files=(
            index.html style.css app.js volumetric.js segmentation.mjs
            surface-core.mjs surface-renderer.mjs surface-ui.mjs spl-provenance.mjs workflow-b5.mjs
            servidor_local.ps1 INICIAR_ANATHEOS.cmd
            DETENER_ANATHEOS.cmd detener_anatheos.ps1
            REINICIAR_ANATHEOS.cmd DIAGNOSTICO_ANATHEOS.cmd diagnostico_anatheos.ps1
            OBTENER_ATLAS_SPL.cmd obtener_atlas_spl.ps1
            ATRIBUCION_ATLAS_SPL.txt ATTRIBUTION_CC_BY_4.0.txt
            GUIA_WINDOWS_B3.md PROTOCOLO_VALIDACION_SLICER_B3.md
            validar_spl_en_slicer.py README.md ATLAS_SPL_PREFLIGHT.md
            PREFLIGHT_DESS_SIN_IDENTIFICADORES.json
            verificar_integridad.ps1 VERIFICAR_INTEGRIDAD.cmd 01_NOVEDADES_Y_SOLUCIONES_V051.txt
          )
          for file in "${files[@]}"; do test -f "$root/$file"; cp "$root/$file" "build/$stage/$file"; done
          if find build -type f | grep -Ei '\.(dcm|dicom|nrrd|nii|stl|obj|zip|png|jpg)$';then echo 'PROHIBITED DATA';exit 1;fi
          (cd build && zip -qr ANATHEOS_3D_v0.6_B5_CODIGO.zip "$stage")
          unzip -t build/ANATHEOS_3D_v0.6_B5_CODIGO.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: anatheos-v06-b5-source-only-no-study
          path: build/ANATHEOS_3D_v0.6_B5_CODIGO.zip
          retention-days: 14
          if-no-files-found: error
  windows-localhost:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Serve B5 startup module from PowerShell 5.1 on loopback
        shell: powershell
        working-directory: demos/anatheos-local-v0.5
        run: |
          $ErrorActionPreference='Stop'
          $root=(Get-Location).Path
          $p=Start-Process powershell.exe -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',('"' + (Join-Path $root 'servidor_local.ps1') + '"')) -PassThru -WindowStyle Hidden
          try {
           $ready=$false;$port=0
           for($i=0;$i -lt 35;$i++){
            foreach($candidate in 8765..8775){
             try {
              $r=Invoke-WebRequest -Uri "http://127.0.0.1:$candidate/workflow-b5.mjs" -UseBasicParsing -TimeoutSec 1
              if($r.StatusCode -eq 200 -and $r.Content -match 'autoOpenBundled'){$ready=$true;$port=$candidate;break}
             }catch{}
            }
            if($ready){break}
            Start-Sleep -Milliseconds 300
           }
           if(-not $ready){throw 'PowerShell local server B5 did not serve workflow module'}
           $uri="http://127.0.0.1:$port/datasets/RTKN0668_MR_DESS.zip"
           $response=$null
           try { Invoke-WebRequest -Uri $uri -Method Head -UseBasicParsing -TimeoutSec 3|Out-Null }
           catch { $response=$_.Exception.Response }
           if(-not $response -or [int]$response.StatusCode -ne 404){throw 'Missing research dataset unexpectedly served in public source checkout'}
           Write-Host 'PASS Windows PowerShell 5.1: B5 workflow served and missing private DESS returns 404'
          }finally{Stop-Process -Id $p.Id -ErrorAction SilentlyContinue}
