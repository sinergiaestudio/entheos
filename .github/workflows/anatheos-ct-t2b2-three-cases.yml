name: ANATHEOS T2-B2 · 3 distinct LCTSC training cases (same-case QA)
on:
  push:
    branches:
      - anatheos/ct-t2b2-independent-multicase-2026-10-29
  pull_request:
    branches:
      - anatheos/ct-t2b1-lctsc-paired-reference-2026-10-29
permissions:
  contents: read
jobs:
  independent-multicase:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install free imaging libraries
        run: python3 -m pip install --disable-pip-version-check --quiet numpy==2.2.6 scipy==1.16.3 pydicom==3.0.1 scikit-image==0.25.2
      - name: Test three different original CT and RTSTRUCT pairs from distinct sites
        run: python3 research/anatheos-t2b2/qa_three_cases.py
