name: Temporary ANATHEOS 3D code snapshots (no deploy)
on:
  push:
    branches: [anatheos/public-dataset-transfer-rtkn0668]
permissions:
  contents: read
jobs:
  snapshot-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public Entheos source and reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive pinned ANATHEOS versions without git data or dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots
          archive_sha() {
            local label="$1" sha="$2"
            git cat-file -e "${sha}^{commit}"
            git archive --format=zip --output="snapshots/${label}.zip" "$sha"
          }
          archive_sha "ENTHEOS_MAIN_8e760228" "8e7602280d6c4fddc234c1973537839592683798"
          archive_sha "ANATHEOS_PILOT_19c945cf" "19c945cf69ff69daa95804639a4aabc9ce9ad7db"
          archive_sha "ANATHEOS_G1B_PR29_27d57c87" "27d57c878a4f6b603293f80f99b4cf003e18e1dd"
          archive_sha "ANATHEOS_CORNERSTONE_PR30_9c0b02d1" "9c0b02d12d94606768e393fd3d9fdc4094baa087"
          archive_sha "ANATHEOS_CHROMIUM_PR31_efa28fde" "efa28fde437283d3f7911fe1dddadbb944da5d95"
          archive_sha "ANATHEOS_MULTIFRAME_LAB_ca52eb6a" "ca52eb6acde08ce70bd1f439b87d756b0cbe2ec2"
          (cd snapshots && sha256sum *.zip >SHA256SUMS_SOURCE.txt)
          cat >snapshots/RECUPERACION.txt <<'INFO'
          ANATHEOS 3D · CODE SNAPSHOTS · 2026-10-26 (America/Argentina/Buenos_Aires).
          Each ZIP is a snapshot of tracked PUBLIC repository source at the exact SHA in its filename.
          This is not a full git history bundle and does not include GitHub issues or comments.
          Unzip to a fresh folder to inspect. Keep the permanent GitHub repository as the versioned truth.
          Stable pilot and main were not modified. Developer draft source snapshots are separate.
          Dataset binaries are backed up in a separate Drive folder, not included here.
          Do not deploy, publish patient records or enable experimental features.
          INFO
          du -sh snapshots
          du -h snapshots/*.zip
      - name: Upload code snapshot group A stable + integration
        uses: actions/upload-artifact@v4
        with:
          name: ANATHEOS-source-stable-and-security
          path: |
            snapshots/ENTHEOS_MAIN_8e760228.zip
            snapshots/ANATHEOS_PILOT_19c945cf.zip
            snapshots/ANATHEOS_G1B_PR29_27d57c87.zip
            snapshots/SHA256SUMS_SOURCE.txt
            snapshots/RECUPERACION.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload code snapshot group B Cornerstone labs
        uses: actions/upload-artifact@v4
        with:
          name: ANATHEOS-source-cornerstone-labs
          path: |
            snapshots/ANATHEOS_CORNERSTONE_PR30_9c0b02d1.zip
            snapshots/ANATHEOS_CHROMIUM_PR31_efa28fde.zip
            snapshots/ANATHEOS_MULTIFRAME_LAB_ca52eb6a.zip
            snapshots/SHA256SUMS_SOURCE.txt
            snapshots/RECUPERACION.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
