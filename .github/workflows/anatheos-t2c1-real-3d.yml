name: ANATHEOS T2-C1 · real thorax five-organ native 3D volume
on:
  push:
    branches:
      - anatheos/ct-t2c1-five-organ-3d-2026-10-29
  pull_request:
    branches:
      - anatheos/ct-t2b3-five-organ-overlay-2026-10-29
permissions:
  contents: read
jobs:
  native-real-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install open source medical imaging and browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pydicom==3.0.1 numpy==2.2.6 scikit-image==0.25.2 scipy==1.16.3 pillow==11.3.0 playwright==1.56.0
          python3 -m playwright install chromium
      - name: Verify original public LCTSC and convert to aligned local NRRD
        shell: bash
        run: |
          set -euo pipefail
          TMP_CASE="$RUNNER_TEMP/anatheos_t2c1_temporary"
          mkdir -p "$TMP_CASE"
          trap 'rm -rf "$TMP_CASE"' EXIT
          TMP_CASE="$TMP_CASE" python3 - <<'PY'
          import hashlib,os,pathlib,urllib.request
          target=pathlib.Path(os.environ["TMP_CASE"])/"public_LCTSC.zip"
          req=urllib.request.Request("https://zenodo.org/records/4747795/files/LCTSC_DICOM_TestData.zip?download=1",
           headers={"User-Agent":"ANATHEOS-T2C1-public-research/1.0"})
          with urllib.request.urlopen(req,timeout=90) as resp:blob=resp.read(45*1024*1024+1)
          if len(blob)>45*1024*1024 or hashlib.md5(blob).hexdigest()!="e472ce41106eb881264f2acb2f2bb1ca":
              raise RuntimeError("Source integrity / size mismatch")
          target.write_bytes(blob)
          print("ANATHEOS_T2C1_SOURCE_HASH=PASS",flush=True)
          PY
          python3 research/anatheos-t2b2/multilayer_viewer/preparar_lctsc.py --zip "$TMP_CASE/public_LCTSC.zip" --output "$TMP_CASE/pair"
          python3 research/anatheos-t2c1/qa_real_3d.py --zip "$TMP_CASE/public_LCTSC.zip" --ct "$TMP_CASE/pair/CT_HU_LPS.nrrd" --mask "$TMP_CASE/pair/LCTSC_RT_5_ORGANOS_LPS.nrrd"
