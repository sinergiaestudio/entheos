name: ANATHEOS W1 · original ZIP unified ingestion
on:
  push:
    branches:
      - anatheos/work-integracion-unificada
  pull_request:
    branches:
      - anatheos/cmr-r3-mainapp-integracion-survey-2026-10-31
permissions:
  contents: read
jobs:
  original-zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free local-only test dependencies
        run: |
          python3 -m pip install --quiet --disable-pip-version-check numpy==2.2.6 Pillow==11.3.0 playwright==1.56.0
          python3 -m playwright install chromium
      - name: Synthetic original ZIP -> catalog -> 2D navigation -> cleanup
        run: python3 research/anatheos-cmr/w1/test_w1_original_zip.py
