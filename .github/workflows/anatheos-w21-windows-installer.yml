name: ANATHEOS W2.1 Windows installer
on:
  pull_request:
    branches: [anatheos/work-integracion-unificada]
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0 pyinstaller==6.16.0 playwright==1.56.0
      - run: python -m playwright install chromium
      - run: choco install nsis --version=3.11 -y --no-progress
      - run: ./packaging/windows/build.ps1
      - run: python packaging/windows/test_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: ANATHEOS-Setup-0.9.0-beta
          path: |
            dist/ANATHEOS-Setup-0.9.0-beta.exe
            dist/SHA256SUMS.txt
